version: 2

models:
  - name: stg_production__products
    description: "Staging model for the product catalog."
    columns:
      - name: product_id
        description: "Primary key. Unique identifier for the product."
        tests:
          - unique
          - not_null
      - name: brand_id
        description: "Foreign key to stg_production__brands."
        tests:
          - relationships:
              arguments:
                to: ref('stg_production__brands')
                field: brand_id
      - name: category_id
        description: "Foreign key to stg_production__categories."
        tests:
          - relationships:
              arguments:
                to: ref('stg_production__categories')
                field: category_id

  - name: stg_production__categories
    description: "Staging model for product categories."
    columns:
      - name: category_id
        description: "Primary key. Unique identifier for the category."
        tests:
          - unique
          - not_null

  - name: stg_production__brands
    description: "Staging model for product brands."
    columns:
      - name: brand_id
        description: "Primary key. Unique identifier for the brand."
        tests:
          - unique
          - not_null